worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    server {
        listen 7860;
        server_name _;

        root /home/user/app/frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # New API routes (ported from nextjs) — keep /api prefix
        location /api/intelligence {
            proxy_pass http://127.0.0.1:8000/api/intelligence;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }
        location /api/chat {
            proxy_pass http://127.0.0.1:8000/api/chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }
        location /api/ml {
            proxy_pass http://127.0.0.1:8000/api/ml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
        location /api/analyze {
            proxy_pass http://127.0.0.1:8000/api/analyze;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }
        location /api/graphrag {
            proxy_pass http://127.0.0.1:8000/api/graphrag;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
        location /api/triage {
            proxy_pass http://127.0.0.1:8000/api/triage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        location /api/investigate {
            proxy_pass http://127.0.0.1:8000/api/investigate;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
        location /api/status {
            proxy_pass http://127.0.0.1:8000/api/status;
            proxy_set_header Host $host;
        }
        location /api/docs {
            proxy_pass http://127.0.0.1:8000/api/docs;
            proxy_set_header Host $host;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://127.0.0.1:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Health check
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }

        # Legacy API routes (strip /api prefix for old backend endpoints)
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
